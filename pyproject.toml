[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2", "repairwheel"]
build-backend = "scikit_build_core.build"

[project]
name = "static_thread_local"
version = "0.0.1"
description = "An example minimal project to experiment variable sharing values"
readme = "README.md"
requires-python = ">=3.8"
classifiers = ["License :: OSI Approved :: BSD License"]

[project.urls]
Homepage = "https://github.com/VincentRouvreau/static_thread_local/"


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"
